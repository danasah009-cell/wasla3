<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6546A8">

  <title>وصلة | متابعة الحافلة المدرسية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-shell">

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">

    <a class="brand" href="#" data-page="home">
      <span class="brand-mark">و</span>
      <span>
        <strong>وصلة</strong>
        <small>رحلتك أقرب، واطمئنانك أكبر</small>
      </span>
    </a>

    <div class="role-switch-wrap">
      <label for="roleSwitch">عرض الواجهة</label>
      <select id="roleSwitch">
        <option value="parent">ولي الأمر</option>
        <option value="supervisor">المشرفة</option>
        <option value="admin">الإدارة</option>
      </select>
    </div>

    <nav id="sideNav" class="side-nav"></nav>

    <div class="sidebar-bottom">
      <div class="help-card">
        <span class="help-icon">؟</span>
        <div>
          <b>تحتاجين مساعدة؟</b>
          <small>مركز مساعدة وصلة</small>
        </div>
      </div>

      <button class="logout-link" id="logoutBtn">
        ↪ تسجيل الخروج
      </button>
    </div>

  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main-area">

    <header class="topbar">

      <button class="icon-btn menu-toggle" id="menuToggle">
        ☰
      </button>

      <div class="mobile-brand">
        <span class="brand-mark">و</span>
        <b>وصلة</b>
      </div>

      <div class="topbar-spacer"></div>

      <button class="icon-btn notification-shortcut"
              data-page="notifications">
        ♧
        <i id="unreadDot" class="unread-dot"></i>
      </button>

      <div class="profile-chip">
        <div class="avatar" id="topAvatar">ر</div>

        <div class="profile-text">
          <b id="topName">ريم العتيبي</b>
          <small id="topRole">ولي الأمر</small>
        </div>

        <span class="chevron">⌄</span>
      </div>

    </header>

    <section id="pageContent" class="page-content"></section>

    <footer class="footer-note">
      وصلة © 2026
      <span>•</span>
      متابعة أسهل، واطمئنان أكبر
    </footer>

  </main>

</div>

<!-- قائمة الجوال -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- رسائل التنبيه -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>

</body>
</html>
